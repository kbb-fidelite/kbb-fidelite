name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} \
            create-checkout \
            create-client \
            create-commande \
            create-facture \
            create-uber-delivery \
            credit-referral-bonus \
            get-admin-data \
            get-client-profile \
            get-delivery-quote \
            get-presence-code \
            manage-adresses \
            manage-flash \
            manage-recompenses \
            save-push-subscription \
            send-monthly-accounting \
            send-push-notification \
            uber-auth \
            uber-webhook \
            update-client \
            update-commande \
            update-horaires \
            validate-reward \
            security-watchdog \
            verify-payment \
            verify-pin \
            verify-presence-code
